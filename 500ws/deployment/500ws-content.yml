name: Publish 500WS content
on:
  push:
    branches: [main]
    paths:
      - '500ws/content/**'
      - '500ws/assets/**'
      - '500ws/*.py'
      - '.github/workflows/500ws-content.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-500ws-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check publishing behavior
        run: python3 -m unittest discover -s 500ws -p test_build.py -v
      - name: Build website
        run: python3 500ws/build.py
      - name: Save generated pages
        run: |
          git config user.name '500WS website'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 500ws
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 500WS content updates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
